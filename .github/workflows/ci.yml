name: CI — Lint, Test, Notebooks

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install CI tooling
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pytest jupyter nbconvert nbformat pipreqs

      - name: Generate requirements.txt with pipreqs (best-effort)
        id: gen_reqs
        run: |
          set -e
          # generate requirements.txt in repo root (non-pinned). pipreqs exits non-zero in some repos; continue anyway.
          if command -v pipreqs >/dev/null 2>&1; then
            pipreqs . --force || true
            STATUS=$?
          else
            echo "# requirements auto-generated by CI (pipreqs missing)" > requirements.txt
            STATUS=0
          fi
          echo "::set-output name=status::$STATUS"
      - name: Show git status after reqgen
        run: |
          git status --porcelain || true
          git --no-pager diff --name-only || true

      - name: Create PR for updated requirements.txt (if changed)
        if: ${{ steps.gen_reqs.outputs.status == '0' && steps.gen_reqs.outputs.status != '' }}
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "CI: update requirements.txt (auto-generated)"
          branch: "ci/auto-requirements-updates"
          title: "CI: update requirements.txt (auto-generated)"
          body: |
            This PR was created automatically by CI to propose an updated `requirements.txt`.
            Please review pinned versions and adjust as needed before merging.
          base: ${{ github.ref_name }}

      - name: Run black (format check)
        run: python -m black --check .

      - name: Run flake8 (lint)
        run: flake8 --ignore=E203,E266,E501,W503,F401

      - name: Run pytest if tests/ exists
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        run: pytest -q

      - name: Execute Jupyter notebooks (skip ones tagged with ci-skip)
        env:
          OUT_DIR: executed_notebooks
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          TIMEOUT=300

          # Build list of notebooks to execute, skipping ones with metadata 'ci-skip' or metadata.ci_skip = true
          NB_LIST=$(python - <<'PY'
import nbformat, pathlib, json
paths = []
for p in sorted(pathlib.Path('.').rglob('*.ipynb')):
    s = str(p)
    if any(part.startswith('.') for part in p.parts): continue
    if '/.venv/' in s or '/env/' in s or '/executed_notebooks/' in s: continue
    try:
        nb = nbformat.read(str(p), as_version=4)
    except Exception:
        continue
    md = nb.metadata if hasattr(nb, 'metadata') else {}
    tags = md.get('tags', []) if isinstance(md.get('tags', []), list) else []
    ci_skip = False
    if md.get('ci-skip') is True or md.get('ci_skip') is True or (isinstance(md.get('ci', {}), dict) and md.get('ci', {}).get('skip') is True):
        ci_skip = True
    if 'ci-skip' in tags:
        ci_skip = True
    if not ci_skip:
        paths.append(str(p))
print("\n".join(paths))
PY
)
          if [ -z "${NB_LIST}" ]; then
            echo "No notebooks to run (all skipped or none present)."
            exit 0
          fi

          echo "Notebooks to execute:"
          echo "$NB_LIST"

          IFS=$'\n'
          for nb in $NB_LIST; do
            echo "---- Executing: $nb ----"
            OUT_PATH="$OUT_DIR/$(dirname "$nb")"
            mkdir -p "$OUT_PATH"
            python - <<'PYCODE'
import nbformat, os, sys
from nbconvert.preprocessors import ExecutePreprocessor
nb_path = sys.argv[1]
out_path = sys.argv[2]
timeout = int(sys.argv[3])
with open(nb_path, 'r', encoding='utf-8') as f:
    nb = nbformat.read(f, as_version=4)
ep = ExecutePreprocessor(timeout=timeout, kernel_name='python3')
print(f"Running {nb_path} (timeout={timeout}s)...")
ep.preprocess(nb, {'metadata': {'path': os.path.dirname(nb_path) or '.'}})
out_file = os.path.join(out_path, os.path.basename(nb_path))
with open(out_file, 'w', encoding='utf-8') as f:
    nbformat.write(nb, f)
print(f"Saved executed notebook to {out_file}")
PYCODE
            "$nb" "$OUT_PATH" "$TIMEOUT"
          done

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: executed_notebooks

      - name: Summary
        if: success()
        run: echo "CI completed successfully."
