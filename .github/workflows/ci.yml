name: CI — Lint, Test, Notebooks (with reqgen & skip-tag)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install CI tooling
        run: |
          python -m pip install --upgrade pip
          # tools we need for linting, notebook execution and req generation
          pip install black flake8 pytest jupyter nbconvert nbformat pipreqs

      - name: Generate requirements.txt with pipreqs (best-effort)
        id: gen_reqs
        run: |
          # pipreqs will create requirements.txt in repo root by scanning imports
          # fallback: if pipreqs exits non-zero, create an empty requirements.txt (so later steps have something)
          set -e
          if command -v pipreqs >/dev/null 2>&1; then
            pipreqs . --force || true
          else
            echo "# requirements auto-generated by CI (pipreqs not available)" > requirements.txt
          fi
          echo "generated=true" >> $GITHUB_OUTPUT

      - name: Commit requirements.txt if changed
        if: steps.gen_reqs.outputs.generated == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "CI: auto-generate requirements.txt"
          file_pattern: "requirements.txt"
          branch: ${{ github.head_ref || github.ref_name }}

      - name: Run black (format check)
        run: |
          python -m black --check .

      - name: Run flake8 (lint)
        run: |
          flake8 --ignore=E203,E266,E501,W503,F401

      - name: Run pytest if tests/ exists
        if: ${{ hashFiles('tests/**/*.py') != '' }}
        run: |
          pytest -q

      - name: Execute Jupyter notebooks (skip ones tagged with ci-skip)
        env:
          OUT_DIR: executed_notebooks
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"

          TIMEOUT=300  # seconds per notebook (adjust if needed)

          # Build list of notebooks to execute, skipping ones with metadata 'ci-skip' tag or metadata.ci_skip = true
          python - <<'PY'
import nbformat, os, sys, json, pathlib
from nbformat import read
nb_paths = []
for p in sorted(pathlib.Path('.').rglob('*.ipynb')):
    # ignore hidden and environment folders
    s = str(p)
    if any(part.startswith('.') for part in p.parts):
        continue
    if '/.venv/' in s or '/env/' in s or '/executed_notebooks/' in s:
        continue
    try:
        nb = nbformat.read(str(p), as_version=4)
    except Exception:
        # if unreadable, skip to avoid breaking CI
        print("Could not read", p)
        continue
    md = nb.metadata if hasattr(nb, 'metadata') else {}
    tags = []
    # common places to put tags: metadata.tags (list) or metadata.get('tags',[])
    if isinstance(md.get('tags'), list):
        tags = md.get('tags', [])
    # custom flag metadata.ci_skip or metadata.get('ci-skip', False)
    ci_skip = False
    if md.get('ci-skip') is True or md.get('ci_skip') is True or md.get('ci', {}).get('skip') is True:
        ci_skip = True
    # Also allow tag string 'ci-skip' in tags
    if 'ci-skip' in tags:
        ci_skip = True
    if ci_skip:
        print(f"Skipping notebook (ci-skip): {p}")
        continue
    nb_paths.append(str(p))
print("NB_LIST_START")
for nb in nb_paths:
    print(nb)
print("NB_LIST_END")
PY
          # read NB_LIST from python print and execute them one by one
          NB_LIST=$(python - <<'PY'
import nbformat, pathlib
paths = []
for p in sorted(pathlib.Path('.').rglob('*.ipynb')):
    s = str(p)
    if any(part.startswith('.') for part in p.parts): continue
    if '/.venv/' in s or '/env/' in s or '/executed_notebooks/' in s: continue
    try:
        nb = nbformat.read(str(p), as_version=4)
    except Exception:
        continue
    md = nb.metadata if hasattr(nb, 'metadata') else {}
    tags = md.get('tags', []) if isinstance(md.get('tags', []), list) else []
    ci_skip = False
    if md.get('ci-skip') is True or md.get('ci_skip') is True or (isinstance(md.get('ci', {}), dict) and md.get('ci', {}).get('skip') is True):
        ci_skip = True
    if 'ci-skip' in tags:
        ci_skip = True
    if not ci_skip:
        paths.append(str(p))
print("\n".join(paths))
PY
)

          if [ -z "${NB_LIST}" ]; then
            echo "No notebooks to run (all skipped or none present)."
            exit 0
          fi

          echo "Notebooks to execute:"
          echo "$NB_LIST"

          IFS=$'\n'
          for nb in $NB_LIST; do
            echo "---- Executing: $nb ----"
            OUT_PATH="$OUT_DIR/$(dirname "$nb")"
            mkdir -p "$OUT_PATH"
            python - <<PYCODE
import nbformat, os, sys
from nbconvert.preprocessors import ExecutePreprocessor
nb_path = sys.argv[1]
out_path = sys.argv[2]
timeout = int(sys.argv[3])
with open(nb_path, 'r', encoding='utf-8') as f:
    nb = nbformat.read(f, as_version=4)
ep = ExecutePreprocessor(timeout=timeout, kernel_name='python3')
print(f"Running {nb_path} (timeout={timeout}s)...")
ep.preprocess(nb, {'metadata': {'path': os.path.dirname(nb_path) or '.'}})
out_file = os.path.join(out_path, os.path.basename(nb_path))
with open(out_file, 'w', encoding='utf-8') as f:
    nbformat.write(nb, f)
print(f"Saved executed notebook to {out_file}")
PYCODE
            "$nb" "$OUT_PATH" "$TIMEOUT"
          done

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: executed_notebooks

      - name: Summary
        if: success()
        run: echo "CI completed successfully."

